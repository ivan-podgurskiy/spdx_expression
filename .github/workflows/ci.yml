name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    name: Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - elixir: "1.14"
            otp: "25"
          - elixir: "1.18"
            otp: "27"
            quality: true
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v7

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      - uses: actions/cache@v6
        with:
          path: |
            deps
            _build
            priv/plts
          key: ${{ runner.os }}-otp${{ matrix.otp }}-elixir${{ matrix.elixir }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-otp${{ matrix.otp }}-elixir${{ matrix.elixir }}-

      - run: mix deps.get
      - run: mix compile --warnings-as-errors
      - run: mix test

      - if: matrix.quality
        run: mix format --check-formatted

      - if: matrix.quality
        run: mix run scripts/generate_spdx_data.exs
        env:
          MIX_ENV: dev

      - if: matrix.quality
        run: git diff --exit-code -- lib/spdx_expression/data.ex

      - if: matrix.quality
        run: mix credo --strict
        env:
          MIX_ENV: dev

      - if: matrix.quality
        run: mix dialyzer --format github

      - if: matrix.quality
        run: mix docs --warnings-as-errors
        env:
          MIX_ENV: dev

      - if: matrix.quality
        run: mix hex.build
        env:
          MIX_ENV: dev
